# Reverse proxy vhost for vmacro.persiq.net -> Vmacro proxy (127.0.0.1:3000)
# ห้ามแก้ vhost อื่นในไฟล์นี้หรือไฟล์ข้างเคียง — ไฟล์นี้คุมเฉพาะ subdomain นี้เท่านั้น
<VirtualHost *:80>
    ServerName vmacro.persiq.net

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/vmacro-error.log
    CustomLog ${APACHE_LOG_DIR}/vmacro-access.log combined
</VirtualHost>
